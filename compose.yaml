services:
  app:
    build: .
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      # Por defecto usa el Ollama del compose. Con Ollama nativo en el host (recomendado en Mac):
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 en tu .env
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://llamacpp:8080/v1}
      DATABASE_URL: postgresql://postgres:dev@pgvector:5432/postgres
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"   # FastAPI: uvicorn ... --host 0.0.0.0 --port 8080
    depends_on: [pgvector, qdrant]

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"   # puerto en tu máquina (11434 suele estar ocupado)
    volumes:
      - ollama:/root/.ollama
    # GPU NVIDIA en Linux/WSL: descomentá esto (requiere nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  # llama.cpp en GPU (el Ollama actual exige driver >= 550 y acá hay 535).
  # Imagen local compilada con CUDA 12.2. Reusa el GGUF de qwen3:8b que bajó Ollama.
  # Levantar: docker compose --profile gpu up -d llamacpp  -> http://llamacpp:8080/v1
  llamacpp:
    image: llama-cpp-server:cuda12.2
    profiles: [gpu]
    command:
      - -m
      - /models/models/blobs/sha256-a3de86cd1c132c822487ededd47a324c50491393e6565cd14bafa40d0b8e686f
      - --alias
      - qwen3:8b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - -c
      - "8192"
      - --jinja
    ports:
      - "8081:8080"
    volumes:
      - ollama:/models:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  ollama:
  pgdata:
  qdrant:
